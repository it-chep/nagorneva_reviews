version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen/go
    opt: paths=source_relative,generate_unbound_methods=true
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.27.3
    out: gen/openapi
    opt: generate_unbound_methods=true,allow_merge=true,merge_file_name=nagorneva_reviews
